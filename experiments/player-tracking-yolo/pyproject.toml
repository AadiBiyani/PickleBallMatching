[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pickleball-yolo-player-tracking"
version = "0.1.0"
description = "Local YOLO pose and ByteTrack player-position experiment"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ultralytics>=8.4,<9",
  "lap>=0.5.12",
  "opencv-python>=4.10",
  "numpy>=1.26",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.9",
  "python-multipart>=0.0.20",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.9"]
browser = ["playwright>=1.58"]

[project.scripts]
player-tracker = "player_tracking.cli:main"

[tool.setuptools.packages.find]
include = ["player_tracking*"]

[tool.setuptools.package-data]
player_tracking = ["static/*", "bytetrack.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
